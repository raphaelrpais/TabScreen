<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TabScreen Demo</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #151515;
        color: #f4f0e8;
      }

      body {
        margin: 0;
        min-height: 140vh;
      }

      main {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 48px 0;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 32px;
        line-height: 1.1;
      }

      p {
        max-width: 720px;
        margin: 0 0 24px;
        color: #c9c1b3;
      }

      .player {
        width: min(820px, 100%);
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
      }

      button {
        margin-top: 16px;
        padding: 10px 14px;
        border: 1px solid #8dd5c6;
        border-radius: 6px;
        background: #8dd5c6;
        color: #10211e;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>TabScreen Demo</h1>
      <p>
        Load the extension, open this page, and press the button. The player should fill only the browser viewport,
        leaving Chrome's UI and the operating system outside of fullscreen.
      </p>

      <div class="player" id="player">
        <video controls poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1280 720'%3E%3Crect width='1280' height='720' fill='%23000'/%3E%3Ccircle cx='640' cy='360' r='110' fill='%238dd5c6'/%3E%3Cpolygon points='610,300 610,420 720,360' fill='%2310211e'/%3E%3C/svg%3E">
          <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
        </video>
      </div>

      <button type="button" id="fullscreen">Request fullscreen on player</button>
    </main>

    <script>
      document.getElementById("fullscreen").addEventListener("click", function () {
        document.getElementById("player").requestFullscreen();
      });
    </script>
  </body>
</html>
